[project]
name = "ic-nematoides"
version = "0.1.0"
description = ""
authors = [
    {name = "Antonio",email = "kraftoiko@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch (>=2.13.0,<3.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "tqdm (>=4.70.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.taskipy.tasks]
run = 'python ic_nematoides/ResNet.py'